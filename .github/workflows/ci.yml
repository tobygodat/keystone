name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Fail rather than wait for a password if a git dependency ever needs one.
  GIT_TERMINAL_PROMPT: 0

jobs:
  check:
    name: test, clippy, check.sh, UI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan1

      # rust-toolchain.toml names the exact release, its components and targets.
      - name: Install the pinned Rust toolchain
        run: |
          rustup --version
          rustup toolchain install
          rustc -V

      # tGPUI is public, so cargo fetches it over HTTPS with no credentials.
      - name: Check that the tGPUI fork is reachable without credentials
        run: git ls-remote https://github.com/tobygodat/tGPUI HEAD > /dev/null

      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          cache-on-failure: true

      # The pinned release check.sh was measured with. The URL is nextest's own.
      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/0.9.148/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --locked

      - name: scripts/test_dev_timing.py
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: python3 scripts/test_dev_timing.py

      - name: scripts/check.sh
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: bash scripts/check.sh

      - name: scripts/check.sh ui (headless)
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: bash scripts/check.sh ui

      # Every test again, with failing claude and codex first on PATH (TOB-363).
      - name: scripts/check.sh providers (no test runs a provider from PATH)
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: bash scripts/check.sh providers
