[workspace]
members = ["crates/keystone-agent", "crates/keystone-core", "crates/keystone-desktop", "crates/keystone-ui"]
default-members = ["crates/keystone-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.dev]
debug = 1


# GPUI, taffy, and text shaping are slow unoptimized. Optimizing dependencies keeps
# workspace crates fast to rebuild while making debug runs and tests render quickly.
[profile.dev.package."*"]
opt-level = 2
