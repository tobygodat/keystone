[package]
name = "keystone-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui = { package = "gpui-pre", git = "https://github.com/tobygodat/tGPUI", rev = "59c962b4207236d1e99840399be25d1c52a469f7" }
anyhow = "1"
smallvec = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-segmentation = "1.13.3"
rquickjs = { version = "0.9", default-features = false }
roxmltree = "0.21"
fontdb = "0.23"
ttf-parser = "0.25"
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[features]
ui-tests = ["gpui/test-support"]
# Lets the automation inbox save a window's rendered frame, for verification on macOS.
capture = ["gpui/test-support"]

[[test]]
name = "components"
required-features = ["ui-tests"]

[[test]]
name = "diagrams"
required-features = ["ui-tests"]

# The gallery draws text and builds on macOS for the reasons keystone-desktop's
# manifest gives.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { package = "gpui-pre-platform", git = "https://github.com/tobygodat/tGPUI", rev = "59c962b4207236d1e99840399be25d1c52a469f7", features = ["font-kit", "runtime_shaders"] }

[dev-dependencies]
resvg = "0.46"
gpui_wgpu = { package = "gpui-pre-wgpu", git = "https://github.com/tobygodat/tGPUI", rev = "59c962b4207236d1e99840399be25d1c52a469f7" }
gpui_platform = { package = "gpui-pre-platform", git = "https://github.com/tobygodat/tGPUI", rev = "59c962b4207236d1e99840399be25d1c52a469f7", features = ["wayland", "x11"] }

[[test]]
name = "layout_timing"
required-features = ["ui-tests"]

[[test]]
name = "perf_lists"
required-features = ["ui-tests"]
