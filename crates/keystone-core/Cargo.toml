[package]
name = "keystone-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
parking_lot = "0.12"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[features]
test-support = []
