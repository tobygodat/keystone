[package]
name = "keystone-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
percent-encoding = "2"
unicode-segmentation = "1"
toml = "1"
toml_edit = "0.25"
url = "2"

[dev-dependencies]
tempfile = "3"

[features]
test-support = []
