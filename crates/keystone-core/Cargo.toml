[package]
name = "keystone-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aho-corasick = "1"
memchr = "2"
# NFC and full case folding for search. Both are already in the build: `url` uses the
# first, and `pulldown-cmark` the second.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
unicase = "2.10"
# How wide a snippet's lead draws. Already in the build, through the terminal emulator
# and the GPU stack.
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
percent-encoding = "2"
unicode-segmentation = "1"
toml = "1"
toml_edit = "0.25"
url = "2"

[dev-dependencies]
tempfile = "3"

[features]
test-support = []
