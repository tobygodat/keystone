[package]
name = "keystone-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
keystone-agent = { path = "../keystone-agent" }
keystone-core = { path = "../keystone-core" }
keystone-ui = { path = "../keystone-ui" }
gpui = { package = "gpui-pre", git = "https://github.com/tobygodat/tGPUI", rev = "59c962b4207236d1e99840399be25d1c52a469f7" }
gpui_platform = { package = "gpui-pre-platform", git = "https://github.com/tobygodat/tGPUI", rev = "59c962b4207236d1e99840399be25d1c52a469f7", features = ["wayland", "x11"] }
anyhow = "1"
futures = "0.3"
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2.0.1"
tempfile = "3"
unicode-segmentation = "1"

# Without font-kit GPUI's macOS text system draws no text. With runtime shaders Metal
# compiles the shaders when the app starts, so a Mac with only the Command Line Tools,
# which have no `metal` compiler, can build Keystone.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", git = "https://github.com/tobygodat/tGPUI", rev = "59c962b4207236d1e99840399be25d1c52a469f7", features = ["font-kit", "runtime_shaders"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[features]
ui-tests = ["gpui/test-support", "gpui_platform/test-support", "keystone-ui/ui-tests", "keystone-core/test-support"]
capture = ["keystone-ui/capture", "gpui_platform/test-support"]
