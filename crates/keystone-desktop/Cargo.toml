[package]
name = "keystone-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
keystone-agent = { path = "../keystone-agent" }
keystone-core = { path = "../keystone-core" }
keystone-ui = { path = "../keystone-ui" }
gpui = { package = "gpui-pre", git = "https://github.com/tobygodat/tGPUI", rev = "e49af9d056e99d5a047428eccb078791d29ad4e0" }
gpui_platform = { package = "gpui-pre-platform", git = "https://github.com/tobygodat/tGPUI", rev = "e49af9d056e99d5a047428eccb078791d29ad4e0", features = ["wayland", "x11"] }
anyhow = "1"
futures = "0.3"
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2.0.1"
tempfile = "3"
unicode-segmentation = "1"

[dev-dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[features]
ui-tests = ["gpui/test-support", "gpui_platform/test-support", "keystone-ui/ui-tests", "keystone-core/test-support"]
