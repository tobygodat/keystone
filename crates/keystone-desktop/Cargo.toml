[package]
name = "keystone-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
keystone-agent = { path = "../keystone-agent" }
keystone-core = { path = "../keystone-core" }
keystone-ui = { path = "../keystone-ui" }
gpui = { package = "gpui-pre", git = "https://github.com/tobygodat/tGPUI", rev = "766668f691fa78b37460b1dda3b162e9bb80a3ad" }
gpui_platform = { package = "gpui-pre-platform", git = "https://github.com/tobygodat/tGPUI", rev = "766668f691fa78b37460b1dda3b162e9bb80a3ad", features = ["wayland", "x11"] }
anyhow = "1"
futures = "0.3"
libc = "0.2"
unicode-segmentation = "1"

[features]
ui-tests = ["gpui/test-support", "gpui_platform/test-support", "keystone-ui/ui-tests"]

[dev-dependencies]
tempfile = "3"

