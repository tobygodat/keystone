\* The code as it is: no fix, no deliberate break. check.sh writes its own
\* configs for the fix and the breaks; this one is for reading a run by hand.
CONSTANTS
    Parent = Parent
    Child = Child
    Task = Task
    Fix = FALSE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OnlyQuitStopsTurns
    NoScheduledRunWhileWaiting
    WindowlessMeansWaiting
PROPERTIES
    WindowlessEventuallyEnds
